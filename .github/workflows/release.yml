name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm (latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Defaults to GITHUB_TOKEN; override with a PAT (RELEASE_TOKEN)
          # if branch protection rules block the bot from pushing back the
          # version commit and tags.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test core package
        run: pnpm --filter @jfitzsimmons2/theme-unify test

      - name: Check for pending changesets
        id: changeset_status
        run: |
          if pnpm changeset status --output=/tmp/changeset-status.json; then
            count=$(node -e "const s=require('/tmp/changeset-status.json');console.log(s.releases.filter(r=>r.type!=='none').length)")
            echo "count=$count" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: No changesets — skipping release
        if: steps.changeset_status.outputs.count == '0'
        run: echo "No pending changesets on main; nothing to publish."

      - name: Configure git
        if: steps.changeset_status.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages
        if: steps.changeset_status.outputs.count != '0'
        # Bumps versions, regenerates CHANGELOG.md, deletes consumed
        # `.changeset/*.md` files. No commit yet.
        run: pnpm changeset version

      - name: Publish to npm
        if: steps.changeset_status.outputs.count != '0'
        # Publishes any package whose version is not already on the registry
        # under the `latest` dist-tag, and creates annotated git tags.
        run: pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and push tags
        if: steps.changeset_status.outputs.count != '0'
        run: |
          git add -A
          git commit -m "chore(release): version packages [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:main --follow-tags
