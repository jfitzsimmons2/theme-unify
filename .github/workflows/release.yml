name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # npm >= 11.5.1 is required for OIDC trusted publishing.
      # `changeset publish` shells out to `npm publish` under the hood.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build Packages
        run: pnpm --filter @jfitzsimmons2/theme-unify run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run ci:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # npm trusted publishing (OIDC) — no NPM_TOKEN needed.
          # Requires `id-token: write` permission above and a Trusted
          # Publisher configured for this package on npmjs.com.
          GITHUB_TOKEN: ${{ secrets.SCOPED_GITHUB_TOKEN }}
